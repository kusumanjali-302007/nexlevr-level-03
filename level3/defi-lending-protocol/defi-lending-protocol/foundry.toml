[profile.default]
src = "contracts"
test = "test-foundry"
out = "out-foundry"
cache_path = "cache_forge"
libs = ["node_modules", "lib"]
solc = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/=node_modules/@openzeppelin/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 100
fail_on_revert = false
